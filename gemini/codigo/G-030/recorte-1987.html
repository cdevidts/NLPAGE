<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{DIARIO}} - {{FECHA}}</title>
  <style>
    @page {
      size: 150mm 215mm;
      margin: 0;
      background: #ffffff;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 150mm;
      background: #ffffff;
      color: #141414;
      font-family: 'Noto Serif', 'Times New Roman', Times, serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .clipping-wrapper {
      width: 150mm;
      padding: 7mm 8mm 6mm 8mm;
      background: #ffffff;
    }
    /* Cabecera del diario (Masthead) */
    .masthead {
      text-align: center;
      border-bottom: 2.2pt solid #141414;
      padding-bottom: 1.5mm;
      margin-bottom: 0.8mm;
    }
    .masthead-title {
      font-family: 'Noto Serif', 'Times New Roman', serif;
      font-size: 21pt;
      font-weight: 700;
      letter-spacing: 1.2pt;
      text-transform: uppercase;
      line-height: 1.05;
      margin: 0;
    }
    .dateline-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 0.6pt solid #141414;
      border-bottom: 0.8pt solid #141414;
      padding: 1mm 0.5mm;
      margin-bottom: 3.5mm;
      font-size: 7.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5pt;
    }
    /* Titular a dos líneas y bajada */
    .headline {
      font-family: 'Noto Serif', 'Times New Roman', serif;
      font-size: 16.5pt;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.2pt;
      margin: 0 0 2mm 0;
      text-align: left;
    }
    .subhead {
      font-family: 'Noto Serif', 'Times New Roman', serif;
      font-size: 9.5pt;
      font-style: italic;
      font-weight: 400;
      line-height: 1.28;
      margin: 0 0 3.2mm 0;
      padding-bottom: 2mm;
      border-bottom: 0.5pt solid #333333;
      color: #222222;
    }
    /* Cuerpo a dos columnas con separador fino */
    .columns-body {
      column-count: 2;
      column-gap: 5.5mm;
      column-rule: 0.45pt solid #444444;
      text-align: justify;
      hyphens: auto;
      -webkit-hyphens: auto;
      font-size: 9.5pt;
      line-height: 1.34;
      letter-spacing: -0.05pt;
    }
    .columns-body p {
      margin: 0 0 2.2mm 0;
      text-indent: 3.2mm;
    }
    .columns-body p:first-of-type {
      text-indent: 0;
    }
    /* Recuadro gris para foto y pie de foto */
    .photo-box-wrapper {
      break-inside: avoid;
      margin: 0 0 2.8mm 0;
      padding-bottom: 1.8mm;
      border-bottom: 0.5pt solid #444444;
    }
    .photo-placeholder {
      width: 100%;
      height: 36mm;
      background-color: #d6d6d6;
      border: 0.6pt solid #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555555;
      font-size: 7pt;
      letter-spacing: 0.6pt;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }
    /* Trama de semitono sutil tipo prensa años 80 */
    .photo-placeholder::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(#888888 0.55px, transparent 0.55px);
      background-size: 2.2px 2.2px;
      opacity: 0.35;
    }
    .photo-caption {
      font-size: 7.2pt;
      line-height: 1.25;
      font-style: italic;
      margin-top: 1.2mm;
      text-align: left;
      color: #1f1f1f;
    }
    /* Pie con número de página */
    .clipping-footer {
      margin-top: 3.5mm;
      padding-top: 1.2mm;
      border-top: 0.5pt solid #444444;
      display: flex;
      justify-content: space-between;
      font-size: 7pt;
      text-transform: uppercase;
      letter-spacing: 0.4pt;
      color: #333333;
    }
  </style>
</head>
<body>
  <div class="clipping-wrapper">
    <header class="masthead">
      <h1 class="masthead-title">{{DIARIO}}</h1>
    </header>
    <div class="dateline-bar">
      <span>{{CIUDAD}}</span>
      <span>{{FECHA}}</span>
      <span>MORNING EDITION</span>
    </div>
    <h2 class="headline">{{TITULAR}}</h2>
    <p class="subhead">{{BAJADA}}</p>
    <div class="columns-body">
      <div class="photo-box-wrapper">
        <div class="photo-placeholder">
          <span>[ ARCHIVAL PRESS PHOTOGRAPH ]</span>
        </div>
        <div class="photo-caption">{{PIE_FOTO}}</div>
      </div>
      {{CUERPO}}
    </div>
    <footer class="clipping-footer">
      <span>{{DIARIO}} ARCHIVES</span>
      <span>PAGE {{PAGINA}}</span>
    </footer>
  </div>
</body>
</html>
